version: 2
updates:
    - package-ecosystem: bun
      directory: /
      schedule:
          interval: weekly
      # Wait a week before proposing a new release: compromised versions are
      # usually caught and pulled within days.
      cooldown:
          default-days: 7
      groups:
          # react and react-dom refuse to run at different versions.
          react:
              patterns:
                  ['react', 'react-dom', '@types/react', '@types/react-dom']
          tailwind:
              patterns: ['tailwindcss', '@tailwindcss/*']
          vite:
              patterns: ['vite', '@vitejs/*']
          # `typescript` is the TS 6 API alias that typescript-eslint needs; `@typescript/native` is tsc 7.
          typescript:
              patterns:
                  ['typescript', '@typescript/native', 'typescript-eslint']
          eslint:
              patterns: ['eslint', '@eslint/*', 'eslint-*']
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      # Wait a week before proposing a new release: compromised versions are
      # usually caught and pulled within days.
      cooldown:
          default-days: 7
