name: Release

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: package.json

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Check tag matches package version
              env:
                  TAG: ${{ github.ref_name }}
              run: |
                  version="v$(jq -r .version package.json)"
                  if [ "$TAG" != "$version" ]; then
                      echo "::error::Tag $TAG does not match package.json version $version"
                      exit 1
                  fi

            - name: Gate
              run: |
                  bun run audit
                  bun run lint
                  bun run typecheck
                  bun run test

            - name: Build extension
              run: bun run build

            - name: Package
              run: |
                  cd dist
                  zip -r ../font-mapper-${{ github.ref_name }}.zip . -x "*.DS_Store"
                  cd ..
                  ls -lh font-mapper-${{ github.ref_name }}.zip

            - name: Keep package for the store
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: extension-zip
                  path: font-mapper-${{ github.ref_name }}.zip
                  if-no-files-found: error
                  retention-days: 7

            - name: Create GitHub Release
              uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
              with:
                  files: font-mapper-${{ github.ref_name }}.zip
                  generate_release_notes: true
                  name: ${{ github.ref_name }}
                  draft: false
                  prerelease: false

    publish:
        needs: release
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: package.json

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Download package
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: extension-zip

            - name: Authenticate to Google Cloud
              id: auth
              uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
              with:
                  workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
                  service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
                  token_format: access_token
                  access_token_scopes: https://www.googleapis.com/auth/chromewebstore

            - name: Upload and publish to the Chrome Web Store
              env:
                  ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
                  EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
                  PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
                  ZIP_PATH: font-mapper-${{ github.ref_name }}.zip
              run: bun scripts/publish-chrome-web-store.ts
