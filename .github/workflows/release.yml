name: Release

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: package.json

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Check tag matches package version
              env:
                  TAG: ${{ github.ref_name }}
              run: |
                  version="v$(jq -r .version package.json)"
                  if [ "$TAG" != "$version" ]; then
                      echo "::error::Tag $TAG does not match package.json version $version"
                      exit 1
                  fi

            - name: Gate
              run: |
                  bun run audit
                  bun run lint
                  bun run typecheck
                  bun run test

            - name: Build extension
              run: bun run build

            - name: Package
              run: |
                  cd dist
                  zip -r ../font-mapper-${{ github.ref_name }}.zip . -x "*.DS_Store"
                  cd ..
                  ls -lh font-mapper-${{ github.ref_name }}.zip

            - name: Create GitHub Release
              uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
              with:
                  files: font-mapper-${{ github.ref_name }}.zip
                  generate_release_notes: true
                  name: ${{ github.ref_name }}
                  draft: false
                  prerelease: false
